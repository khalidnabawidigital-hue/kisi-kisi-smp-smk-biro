<style>
:root{--ink:#12251e;--mut:#51655c;--paper:#f5f8f5;--card:#fff;--line:#d6e1da;--gold:#eaa51a;--hots:#a84b12;--hotsbg:#fdebdc;
--acc:#0e5a43;--accd:#07382a;--accl:#e4f1ea;--r:14px;
--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Instrument Sans','Segoe UI',system-ui,sans-serif}
body[data-j=smk]{--acc:#2d3f9e;--accd:#1a2766;--accl:#e6e9f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--fd);line-height:1.1;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
svg.star{display:block}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--accd);color:#fff;border-bottom:3px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fd);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand small{display:block;font:500 .72rem var(--fb);opacity:.75}
.nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:99px;color:#fff;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.14);opacity:1}
.nav a[aria-current=page]{background:var(--gold);color:#2b1d00;opacity:1}
@media(max-width:640px){.brand span small{display:none}.brand{font-size:.95rem}}

/* home */
.hero{background:var(--accd);color:#fff;position:relative;overflow:hidden;
background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px)}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px;position:relative}
.hero .bgstar{position:absolute;right:-120px;top:-110px;width:520px;opacity:.09;pointer-events:none}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.7rem);font-weight:800;letter-spacing:-.02em}
.hero p.lead{font-size:1.1rem;max-width:34em;opacity:.9;margin:18px 0 28px}
.school{display:inline-block;background:var(--gold);color:#2b1d00;font-weight:600;font-size:.85rem;padding:5px 12px;border-radius:99px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:600 1rem var(--fb);padding:12px 22px;border-radius:12px;text-decoration:none;background:var(--gold);color:#2b1d00}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.note{background:#fffdf4;color:var(--ink);border-radius:var(--r);padding:22px 24px 22px 56px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);
background-image:linear-gradient(90deg,transparent 40px,#e9a6a6 40px 41px,transparent 41px),repeating-linear-gradient(0deg,transparent 0 31px,#cfdcec 31px 32px);transform:rotate(1.2deg)}
.note h2{font-size:1.2rem;margin-bottom:12px;line-height:32px}
.note ol{margin:0;padding:0;list-style:none;counter-reset:s}
.note li{counter-increment:s;line-height:32px;position:relative}
.note li::before{content:counter(s) ".";font-weight:700;color:var(--acc);margin-right:8px}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:52px}.note{transform:none}}

section.klas{padding:56px 0 28px}
.klas h2{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:6px}
.klas .sub{color:var(--mut);margin:0 0 28px}
.grp{margin-bottom:34px}
.grp h3{font-size:1.15rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.grp h3 i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:700px){.tiles{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--c)}
.tile .big{font:800 3.4rem/1 var(--fd);color:var(--c)}
.tile b{font-size:1.05rem}
.tile .st{font-size:.85rem;margin-top:8px;color:var(--mut)}
.tile .st.ok{color:var(--c);font-weight:600}
.tile.smp{--c:#0e5a43}.tile.smk{--c:#2d3f9e}
.grp.smp h3{--c:#0e5a43}.grp.smk h3{--c:#2d3f9e}

footer{margin-top:56px;background:var(--accd);color:#fff;padding:26px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;opacity:.85}

/* class page */
.chero{background:var(--accd);color:#fff;padding:36px 0 44px;position:relative;overflow:hidden;
background-image:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.06) 39px 40px)}
.crumb{font-size:.9rem;opacity:.85;margin-bottom:14px}
.crumb a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}
.chero h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800;letter-spacing:-.015em;max-width:18em}
.chero .per{opacity:.9;margin:10px 0 24px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0}
.meta div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px}
.meta dt{font-size:.78rem;opacity:.75}
.meta dd{margin:0;font-weight:600}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:-26px;position:relative}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 10px 24px -16px rgba(18,37,30,.35)}
.card h2{font-size:1.1rem;margin-bottom:14px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 2.2rem;gap:10px;align-items:center;margin:9px 0;font-size:.9rem}
.bar .t{height:12px;border-radius:99px;background:var(--accl);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar b{text-align:right}
.bar.h .t i{background:var(--hots)}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:6px 0 10px;font-weight:600;font-size:.85rem}
.split span{display:flex;align-items:center;justify-content:center;color:#fff}
.split span{min-width:0;overflow:hidden;white-space:nowrap}.split .LOTS{background:var(--acc)}.split .MOTS{background:#a97800}.split .HOTS{background:var(--hots)}
.kt.MOTS{background:#fff3d1;color:#6b4c00;border:1.5px solid #a97800}
.subs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.subs a{padding:8px 18px;border-radius:99px;border:2px solid rgba(255,255,255,.45);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem}
.subs a:hover{background:rgba(255,255,255,.12)}
.subs a[aria-current=page]{background:var(--gold);border-color:var(--gold);color:#2b1d00}

.tools{position:sticky;top:63px;z-index:20;background:var(--paper);padding:14px 0 10px;margin-top:20px;border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input,.tools select{font:500 .95rem var(--fb);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
.tools input{flex:1 1 220px}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{font:600 .9rem var(--fb);border:0;background:none;padding:0 14px;min-height:40px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.cnt{font-size:.88rem;color:var(--mut);margin-left:auto}
.pr{font:600 .9rem var(--fb);border:2px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}

.bab{margin-top:30px}
.bab header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:12px}
.bab h2{font-size:1.4rem}
.bab h2 span{color:var(--acc)}
.bab .jml{font-size:.85rem;font-weight:600;background:var(--accl);color:var(--acc);padding:3px 10px;border-radius:99px}
.bab .desc{flex-basis:100%;margin:0;color:var(--mut);font-size:.95rem}
.bab .src{font-size:.9rem;font-weight:600;color:var(--acc)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:3.2rem 11rem 1fr 9rem;gap:14px;padding:13px 18px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.hd{background:var(--accl);font-weight:600;font-size:.85rem;color:var(--accd)}
.row .no{font:800 1.1rem var(--fd);color:var(--acc)}
.row .mt{font-weight:600}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.lv,.kt{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lv{background:var(--accl);color:var(--accd)}
.kt.LOTS{border:1.5px solid var(--acc);color:var(--acc)}
.kt.HOTS{background:var(--hotsbg);color:var(--hots);border:1.5px solid var(--hots)}
.lv.hi{background:var(--hots);color:#fff}
.empty{padding:28px;text-align:center;color:var(--mut)}
@media(max-width:720px){
.row.hd{display:none}
.row{grid-template-columns:2.4rem 1fr;gap:4px 10px;padding:14px}
.row .no{grid-row:1/4}
.row .ind,.row .tg{grid-column:2}
.row .tg{margin-top:4px}
.tools{top:60px}.cnt{flex-basis:100%;margin:0}
}

/* unavailable */
.na{text-align:center;padding:72px 0 40px;max-width:560px;margin:0 auto}
.na .ico{width:96px;height:96px;margin:0 auto 22px;border-radius:50%;background:var(--accl);display:grid;place-items:center;color:var(--acc)}
.na h1{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:12px}
.na p{color:var(--mut);margin:0 0 26px}
.na .btn{background:var(--acc);color:#fff}
.na .btn.ghost{background:transparent;color:var(--acc);margin-left:6px}

@media print{.top,.tools,.pr,footer,.hero .bgstar{display:none}.chero{background:none;color:#000;padding:0}.meta div{background:#eee}.panel{margin-top:10px}.card{box-shadow:none}body{background:#fff}.row{break-inside:avoid}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const LV={C1:'Mengingat',C2:'Memahami',C3:'Menerapkan',C4:'Menganalisis',C5:'Mengevaluasi',C6:'Mencipta'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAR=(w,c)=>`<svg class="star" width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true"><g fill="${c}"><rect x="20" y="20" width="60" height="60"/><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/></g></svg>`;
let S={q:'',bab:'all',kat:'all',lv:'all'};

function nav(active){
  $('#nav').innerHTML=KELAS.map(k=>`<a href="#kelas-${k.n}" ${k.n===active?'aria-current="page"':''}>Kelas ${k.n}</a>`).join('');
}

function home(){
  document.body.dataset.j='smp';document.title='Kisi-kisi Ujian · SMP & SMK Bintang Raudloh';nav(0);
  const tile=k=>{const d=DATA[k.n];const j=k.j.toLowerCase();
    return `<a class="tile ${j}" href="#kelas-${k.n}"><span class="big">${k.n}</span><b>Kelas ${k.r}</b>
    <span class="st ${d?'ok':''}">${d?(d.length>1?`${d.length} mata pelajaran: ${d.map(s=>s.short).join(', ')}`:`Tersedia · ${d[0].total} soal`):'Belum tersedia'}</span></a>`};
  const grp=(j,t)=>`<div class="grp ${j.toLowerCase()}"><h3><i></i>${t}</h3><div class="tiles">${KELAS.filter(k=>k.j===j).map(tile).join('')}</div></div>`;
  $('#app').innerHTML=`
  <section class="hero"><div class="bgstar">${STAR(520,'#fff')}</div>
   <div class="wrap"><div>
    <span class="school">SMP &amp; SMK Bintang Raudloh</span>
    <h1>Kisi-kisi Ujian Tahun Pelajaran 2026/2027</h1>
    <p class="lead">Pilih kelasmu untuk melihat materi, indikator soal, dan tingkat kesulitan setiap nomor ujian.</p>
    <button class="btn" id="go">Pilih kelas</button>
   </div>
   <aside class="note" aria-label="Cara memakai"><h2>Cara memakai</h2>
    <ol><li>Pilih kelasmu di bawah.</li><li>Pelajari kisi-kisi per bab.</li><li>Cari materi dengan kolom pencarian.</li><li>Buka materi bab untuk belajar.</li></ol></aside>
   </div></section>
  <section class="klas" id="kelas"><div class="wrap">
   <h2>Pilih kelas</h2><p class="sub">Kisi-kisi ditampilkan sesuai kelasmu.</p>
   ${grp('SMP','SMP Bintang Raudloh')}${grp('SMK','SMK Bintang Raudloh')}
  </div></section>`;
  $('#go').onclick=()=>$('#kelas').scrollIntoView({behavior:'smooth'});
}

function bars(rows,cls=''){const m=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(r=>`<div class="bar ${cls}"><span>${esc(r[0])}</span><span class="t"><i style="width:${r[1]/m*100}%"></i></span><b>${r[1]}</b></div>`).join('')}

function unavailable(k){
  document.body.dataset.j=k.j.toLowerCase();document.title=`Kisi-kisi Kelas ${k.r} tidak tersedia`;nav(k.n);
  $('#app').innerHTML=`<div class="wrap"><div class="na">
   <div class="ico"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M9 11l6 6M15 11l-6 6"/></svg></div>
   <h1>Mohon maaf, kisi-kisi tidak tersedia</h1>
   <p>Kisi-kisi ujian Kelas ${k.r} (${k.j} Bintang Raudloh) belum diunggah. Silakan tanyakan kepada guru mata pelajaran atau cek kembali beberapa hari lagi.</p>
   <a class="btn" href="#">Kembali ke beranda</a></div></div>`;
}

function kelas(n,sid){
  const k=KELAS.find(x=>x.n===n);if(!k)return home();
  const subs=DATA[n];if(!subs)return unavailable(k);
  const d=subs.find(s=>s.id===sid)||subs[0];
  document.body.dataset.j=k.j.toLowerCase();nav(n);S={q:'',bab:'all',kat:'all',lv:'all'};
  document.title=`Kisi-kisi Ujian ${d.mapel} Kelas ${k.r} · ${k.j} Bintang Raudloh`;
  const all=d.babs.flatMap(b=>b.items);
  const lvc=Object.keys(LV).map(c=>[`${c} · ${LV[c]}`,all.filter(i=>i.level===c).length]);
  const kats=['LOTS','MOTS','HOTS'].filter(c=>all.some(i=>i.kat===c));
  const cn=c=>all.filter(i=>i.kat===c).length;
  $('#app').innerHTML=`
  <section class="chero"><div class="wrap">
   <div class="crumb"><a href="#">Beranda</a> / Kelas ${k.r}</div>
   ${subs.length>1?`<nav class="subs" aria-label="Mata pelajaran">${subs.map(s=>`<a href="#kelas-${n}-${s.id}" ${s===d?'aria-current="page"':''}>${esc(s.label)}</a>`).join('')}</nav>`:''}
   <h1>Kisi-kisi Ujian ${esc(d.mapel)} ${k.j} Kelas ${k.r}</h1>
   <p class="per">${esc(d.periode)}</p>
   <dl class="meta">${d.meta.map(m=>`<div><dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd></div>`).join('')}</dl>
  </div></section>
  <div class="wrap"><div class="panel">
   <div class="card"><h2>Jumlah soal per bab</h2>${bars(d.babs.map(b=>[`Bab ${b.no} · ${b.title}`,b.items.length]))}</div>
   <div class="card"><h2>Tingkat kemampuan berpikir</h2>
    <div class="split" role="img" aria-label="${kats.map(c=>c+' '+cn(c)+' soal').join(', ')}">${kats.map(c=>`<span class="${c}" style="flex:${cn(c)}">${c} ${cn(c)}</span>`).join('')}</div>
    ${bars(lvc)}</div>
  </div></div>
  <div class="tools"><div class="wrap">
   <input id="q" type="search" placeholder="Cari materi atau indikator…" aria-label="Cari materi atau indikator">
   <select id="fb" aria-label="Filter bab"><option value="all">Semua bab</option>${d.babs.map(b=>`<option value="${b.no}">Bab ${b.no}</option>`).join('')}</select>
   <select id="fl" aria-label="Filter level"><option value="all">Semua level</option>${Object.keys(LV).map(c=>`<option>${c}</option>`).join('')}</select>
   <div class="seg" id="fk">${['all',...kats].map(v=>`<button data-v="${v}" aria-pressed="${v==='all'}">${v==='all'?'Semua':v}</button>`).join('')}</div>
   <button class="pr" onclick="print()">Cetak</button>
   <span class="cnt" id="cnt" aria-live="polite"></span>
  </div></div>
  <div class="wrap" id="list"></div>
  <div class="wrap" style="margin-top:36px;display:flex;gap:10px;flex-wrap:wrap">
   ${KELAS.filter(x=>x.n!==n).map(x=>`<a class="pr" style="display:inline-flex;align-items:center;text-decoration:none" href="#kelas-${x.n}">Kelas ${x.n}</a>`).join('')}</div>`;
  $('#q').oninput=e=>{S.q=e.target.value;list(d)};
  $('#fb').onchange=e=>{S.bab=e.target.value;list(d)};
  $('#fl').onchange=e=>{S.lv=e.target.value;list(d)};
  $('#fk').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.kat=b.dataset.v;
    [...$('#fk').children].forEach(x=>x.setAttribute('aria-pressed',x===b));list(d)};
  list(d);
}

function list(d){
  const q=S.q.trim().toLowerCase();let shown=0;
  const html=d.babs.filter(b=>S.bab==='all'||String(b.no)===S.bab).map(b=>{
    const it=b.items.filter(i=>(S.lv==='all'||i.level===S.lv)&&(S.kat==='all'||i.kat===S.kat)&&(!q||(i.materi+' '+i.indikator).toLowerCase().includes(q)));
    if(!it.length)return'';shown+=it.length;
    return `<section class="bab"><header><h2><span>Bab ${b.no}</span> ${esc(b.title)}</h2><span class="jml">${it.length} dari ${b.items.length} soal</span>
     ${b.desc?`<p class="desc">${esc(b.desc)}</p>`:''}${b.link?`<a class="src" href="${esc(b.link)}" target="_blank" rel="noopener">Buka materi bab ${b.no} ↗</a>`:''}</header>
     <div class="rows"><div class="row hd"><span>No.</span><span>Materi</span><span>Indikator soal</span><span>Level</span></div>
     ${it.map(i=>`<div class="row"><span class="no">${i.no}</span><span class="mt">${esc(i.materi)}</span><span class="ind">${esc(i.indikator)}</span>
      <span class="tg"><span class="lv ${i.kat==='HOTS'?'hi':''}" title="${LV[i.level]}">${i.level}</span><span class="kt ${i.kat}">${i.kat}</span></span></div>`).join('')}</div></section>`}).join('');
  $('#list').innerHTML=html||'<div class="rows" style="margin-top:30px"><p class="empty">Tidak ada indikator yang cocok. Ubah kata kunci atau filter.</p></div>';
  $('#cnt').textContent=`Menampilkan ${shown} soal`;
}

function route(){
  const m=location.hash.match(/^#kelas-(\d+)(?:-([a-z]+))?$/);
  m?kelas(+m[1],m[2]):home();
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
